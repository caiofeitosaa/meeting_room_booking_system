spring.application.name=meeting_room_booking_system

# is the way to create comments on the application properties
# 1. Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/meeting_room?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 2. Database Credentials - Change to your actual MySQL username and password
# the '${}' syntax is a Spring property placeholder.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 3. MySQL Driver Class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Hibernate Settings - Automatically creates and updates database tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

